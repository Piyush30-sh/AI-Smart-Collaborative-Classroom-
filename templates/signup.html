<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — AI Classroom</title>
  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script>
    (function syncThemeEarly() {
      try {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const raw = localStorage.getItem('theme') || localStorage.getItem('siteTheme');
        const theme = (raw === 'dark' || raw === 'light') ? raw : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-bs-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />

</head>

<body class="auth-body">

  <!-- Dark-mode toggle (top-right) -->
  <div class="position-fixed top-0 end-0 p-3" style="z-index:999">
    <div class="form-check form-switch mb-0">
      <input class="form-check-input" type="checkbox" id="darkToggle" role="switch" />
      <label class="form-check-label text-muted" for="darkToggle">
        <i class="fas fa-moon"></i>
      </label>
    </div>
  </div>

  <!-- Home Button (Top-Left) -->
  <div class="position-fixed top-0 start-0 p-3" style="z-index:999">
    <a href="{{ url_for('index') }}" class="btn btn-sm auth-home-btn shadow-sm">
      <i class="fas fa-arrow-left me-2"></i>Home
    </a>
  </div>

  <div class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100">
    <div class="auth-card card shadow-lg border-0 p-4" style="width: 440px; max-width: 95vw;">
      <div class="card-body p-3">

        <!-- Brand -->
        <div class="text-center mb-4">
          <div class="auth-brand-icon mb-3 text-primary">
            <i class="fas fa-graduation-cap fa-2x"></i>
          </div>
          <h3 class="fw-bold">Create Account</h3>
          <p class="text-muted small">Join your institutional AI classroom workspace</p>
        </div>


        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for cat, msg in messages %}
              <div class="alert alert-{{ cat }} alert-dismissible fade show py-2" role="alert">
                {{ msg }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}


        <!-- Role Selector Toggle (Student vs Faculty) -->
        <div class="role-selector mb-4 p-1 rounded-3 d-flex">
          <button type="button" class="role-btn active" id="btnStudent" onclick="switchRole('student')">
            🎓 Student
          </button>
          <button type="button" class="role-btn" id="btnFaculty" onclick="switchRole('faculty')">
            🏫 Faculty
          </button>
        </div>

        <!-- Signup form -->
        <form method="POST" novalidate>
          <input type="hidden" id="userType" name="user_type" value="student" />
          <div class="mb-3">
            <label for="name" class="form-label fw-semibold">Full name</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-user text-muted"></i></span>
              <input type="text" class="form-control" id="name" name="name"
                     placeholder="Your name" required autocomplete="name" />
            </div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email address</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
              <input type="email" class="form-control" id="email" name="email" placeholder="student@university.edu" required autocomplete="email" />
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
              <input type="password" class="form-control" id="password" name="password" placeholder="Min 6 characters" required minlength="6" autocomplete="new-password" />
              <button class="btn btn-outline-secondary" type="button" id="togglePwd" tabindex="-1">
                <i class="fas fa-eye" id="eyeIcon"></i>
              </button>
            </div>
            <div class="form-text text-muted small mt-1">At least 6 characters.</div>
          </div>

          <!-- Password strength bar -->
          <div class="mb-3">
            <div class="progress" style="height:5px; background: rgba(100, 116, 139, 0.2);">
              <div class="progress-bar" id="strengthBar" role="progressbar" style="width:0%" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
            <div class="form-text text-muted small" id="strengthText"></div>
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary w-100 fw-semibold py-2.5 mb-3" >
            <i class="fas fa-user-plus me-2"></i>Create Student Account
          </button>
        </form>

        
        <p class="text-center mb-0 small text-muted">
          Already have an account?
          <a href="{{ url_for('login') }}" class="fw-bold" data-auth-transition style="color: #6366f1;">Login</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script>
    let currentRole = 'student';

    // Switch Role Logic
    function switchRole(role) {
      currentRole = role;
      const btnStudent = document.getElementById('btnStudent');
      const btnFaculty = document.getElementById('btnFaculty');
      const submitBtn = document.getElementById('submitBtn');
      const emailInput = document.getElementById('email');
      const userTypeInput = document.getElementById('userType');

      userTypeInput.value = role;
      if (role === 'student') {
        btnStudent.classList.add('active');
        btnFaculty.classList.remove('active');
        submitBtn.innerHTML = '<i class="fas fa-user-plus me-2"></i>Create Student Account';
        emailInput.placeholder = 'student@university.edu';
      } else {
        btnFaculty.classList.add('active');
        btnStudent.classList.remove('active');
        submitBtn.innerHTML = '<i class="fas fa-user-plus me-2"></i>Create Faculty Account';
        emailInput.placeholder = 'faculty@university.edu';
      }
    }

    // Password visibility toggle
    document.getElementById('togglePwd').addEventListener('click', () => {
      const pwd  = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
      icon.classList.toggle('fa-eye');
      icon.classList.toggle('fa-eye-slash');
    });

    // Password strength meter
    document.getElementById('password').addEventListener('input', function () {
      const val = this.value;
      const bar = document.getElementById('strengthBar');
      const txt = document.getElementById('strengthText');
      let score = 0;
      if (val.length >= 6)  score++;
      if (val.length >= 10) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const levels = [
        { pct: 0,   cls: '',             lbl: '' },
        { pct: 20,  cls: 'bg-danger',    lbl: 'Very weak' },
        { pct: 40,  cls: 'bg-warning',   lbl: 'Weak' },
        { pct: 60,  cls: 'bg-info',      lbl: 'Fair' },
        { pct: 80,  cls: 'bg-primary',   lbl: 'Strong' },
        { pct: 100, cls: 'bg-success',   lbl: 'Very strong' },
      ];
      const l = levels[score];
      bar.style.width    = l.pct + '%';
      bar.className      = 'progress-bar ' + l.cls;
      txt.textContent    = l.lbl;
    });

    // Signup form submission logic
    function handleSignup(event) {
      event.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!name || !email || !password) {
        alert('Please fill in all required fields.');
        return;
      }

      // Save user details locally and route by role
      localStorage.setItem('userRole', currentRole);
      localStorage.setItem('userName', name);
      localStorage.setItem('userEmail', email);

      if (currentRole === 'faculty') {
        window.location.href = 'dashboard-faculty.html';
      } else {
        window.location.href = 'dashboard-student.html';
      }
    }
  </script>
</body>
</html>
