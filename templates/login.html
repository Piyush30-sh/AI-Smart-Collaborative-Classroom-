<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — AI Classroom</title>
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />

</head>

<body class="auth-body">

  <!-- Home Button (Top-Left) -->
  <div class="position-fixed top-0 start-0 p-3" style="z-index:999">
    <a href="{{ url_for('index') }}" class="btn btn-sm btn-secondary shadow-sm" style="background: #1e293b; border: none;">
      <i class="fas fa-arrow-left me-2"></i>Home
    </a>
  </div>

  <!-- Dark-mode toggle (top-right) -->
  <div class="position-fixed top-0 end-0 p-3" style="z-index:999">
    <div class="form-check form-switch mb-0">
      <input class="form-check-input" type="checkbox" id="darkToggle" role="switch" />
      <label class="form-check-label text-muted" for="darkToggle">
        <i class="fas fa-moon"></i>
      </label>
    </div>
  </div>

  <div class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100">
    <div class="auth-card card shadow-lg border-0" style="width:420px;max-width:95vw">
      <div class="card-body p-5">

        <!-- Brand / Header with Student/Graduate Logo -->
        <div class="text-center mb-4">
          <div class="auth-brand-icon mb-2 text-indigo-400">
            <i class="fas fa-user-graduate fa-3x"></i>
          </div>
          <h3 class="fw-bold text-white">AI Classroom</h3>
          <p class="text-muted small">Smart classroom management for Faculty & Students</p>
        </div>

        <!-- Role Selector Toggle (Student vs Faculty) -->
        <div class="mb-4 p-1 rounded-3 d-flex" style="background: #0f172a; border: 1px solid #334155;">
          <button type="button" class="role-btn active" id="btnStudent" onclick="switchRole('student')">
            🎓 Student
          </button>
          <button type="button" class="role-btn" id="btnFaculty" onclick="switchRole('faculty')">
            🏫 Faculty
          </button>
        </div>

        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for cat, msg in messages %}
              <div class="alert alert-{{ cat }} alert-dismissible fade show py-2" role="alert">
                {{ msg }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <!-- Login form -->


        <!-- Login form -->
        <!-- <form id="loginForm" onsubmit="handleLogin(event)">
          
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold small text-slate-300">Email address</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
              <input type="email" class="form-control" id="email" name="email" placeholder="student@university.edu" required autocomplete="email" />
            </div>
          </div>   -->

        <form method="POST" novalidate>
          <input type="hidden" id="userType" name="user_type" value="student" />
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email address</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
              <input type="email" class="form-control" id="email" name="email"
                     placeholder="you@example.com" required autocomplete="email" />
            </div>
          </div>

          <!--<div class="mb-3">
            <label for="password" class="form-label fw-semibold small text-slate-300">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
              <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required autocomplete="current-password" />
              <button class="btn btn-outline-secondary" type="button" id="togglePwd" tabindex="-1" title="Show/hide password" style="border-color: #334155;">
                <i class="fas fa-eye" id="eyeIcon"></i>
              </button>
            </div>
          </div> -->
          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
              <input type="password" class="form-control" id="password" name="password"
                     placeholder="Enter password" required autocomplete="current-password" />
              <button class="btn btn-outline-secondary" type="button" id="togglePwd"
                      tabindex="-1" title="Show/hide password">
                <i class="fas fa-eye" id="eyeIcon"></i>
              </button>
            </div>
          </div>


          <div class="mb-3 text-end small">
            <a href="{{ url_for('forgot') }}" class="fw-bold" style = "color: #427ddd;" >Forgot password?</a>
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary w-100 fw-semibold py-2.5 mb-3" >
            <i class="fas fa-sign-in-alt me-2"></i>Login as Student
          </button>
        </form>


        
        <p class="text-center mb-0 small text-muted">
          Don't have an account?
          <a href="{{ url_for('signup') }}" class="fw-bold" style = "color: #6366f1;">Create one</a>
        </p>

      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  
    <script>
    // Password visibility toggle
    document.getElementById('togglePwd').addEventListener('click', () => {
      const pwd  = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        pwd.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    });
  </script>
  
  <script>
    let currentRole = 'student';

    function switchRole(role) {
      currentRole = role;
      const btnStudent = document.getElementById('btnStudent');
      const btnFaculty = document.getElementById('btnFaculty');
      const submitBtn = document.getElementById('submitBtn');
      const emailInput = document.getElementById('email');
      const userTypeInput = document.getElementById('userType');

      userTypeInput.value = role;
      if (role === 'student') {
        btnStudent.classList.add('active');
        btnFaculty.classList.remove('active');
        submitBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Login as Student';
        emailInput.placeholder = 'student@university.edu';
      } else {
        btnFaculty.classList.add('active');
        btnStudent.classList.remove('active');
        submitBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Login as Faculty';
        emailInput.placeholder = 'faculty@university.edu';
      }
    }

    document.getElementById('togglePwd').addEventListener('click', () => {
      const pwd  = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
      icon.classList.toggle('fa-eye');
      icon.classList.toggle('fa-eye-slash');
    });

    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      if (!email) return alert('Please enter your email');

      localStorage.setItem('userRole', currentRole);
      localStorage.setItem('userEmail', email);

      if (currentRole === 'faculty') {
        window.location.href = 'dashboard-faculty.html';
      } else {
        window.location.href = 'dashboard-student.html';
      }
    }
  </script>
</body>
</html>
