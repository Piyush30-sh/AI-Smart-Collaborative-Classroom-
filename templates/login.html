<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — AI Classroom</title>
  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script>
    (function syncThemeEarly() {
      try {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const raw = localStorage.getItem('theme') || localStorage.getItem('siteTheme');
        const theme = (raw === 'dark' || raw === 'light') ? raw : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-bs-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />

</head>

<body class="auth-body">

  <!-- Home Button (Top-Left) -->
  <div class="position-fixed top-0 start-0 p-3" style="z-index:999">
    <a href="{{ url_for('index') }}" class="btn btn-sm auth-home-btn shadow-sm">
      <i class="fas fa-arrow-left me-2"></i>Home
    </a>
  </div>

  <!-- Dark-mode toggle (top-right) -->
  <div class="position-fixed top-0 end-0 p-3" style="z-index:999">
    <div class="form-check form-switch mb-0">
      <input class="form-check-input" type="checkbox" id="darkToggle" role="switch" />
      <label class="form-check-label text-muted" for="darkToggle">
        <i class="fas fa-moon"></i>
      </label>
    </div>
  </div>

  <div class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100">
    <div class="auth-card card shadow-lg border-0" style="width:420px;max-width:95vw">
      <div class="card-body p-5">

        <!-- Brand / Header with Student/Graduate Logo -->
        <div class="text-center mb-4">
          <div class="auth-brand-icon mb-3 text-primary">
            <i class="fas fa-graduation-cap fa-2x"></i>
          </div>
          <h3 class="fw-bold">AI Classroom</h3>
          <p class="text-muted small">Smart classroom management for Faculty & Students</p>
        </div>

        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} alert-dismissible fade show py-2" role="alert">
          {{ msg }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <!-- Role Selector Toggle (Student vs Faculty) -->


        <form method="POST">
          <input type="hidden" id="userType" name="user_type" value="student" />
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email address</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
              <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required
                autocomplete="email" />
            </div>
          </div>


          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
              <input type="password" class="form-control" id="password" name="password" placeholder="Enter password"
                required autocomplete="current-password" />
              <button class="btn btn-outline-secondary" type="button" id="togglePwd" tabindex="-1"
                title="Show/hide password">
                <i class="fas fa-eye" id="eyeIcon"></i>
              </button>
            </div>
          </div>


          <div class="mb-3 text-end small">
            <a href="{{ url_for('forgot') }}" class="fw-bold" style="color: #427ddd;">Forgot password?</a>
          </div>
          <!-- From Uiverse.io by gharsh11032000 -->
          <button type="submit" class="animated-button" id="submitBtn">
            <svg viewBox="0 0 24 24" class="arr-2" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z">
              </path>
            </svg>
            <span class="text">Login As Student</span>
            <span class="circle"></span>
            <svg viewBox="0 0 24 24" class="arr-1" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z">
              </path>
            </svg>
          </button>

        </form>



        <p class="text-center mb-0 small text-muted">
          Don't have an account?
          <a href="{{ url_for('signup') }}" class="fw-bold" data-auth-transition style="color: #6366f1;">Create one</a>
        </p>

      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>

  <script>
    let currentRole = 'student';

    // Switch Role Logic
    function switchRole(role) {
      currentRole = role;
      const btnStudent = document.getElementById('btnStudent');
      const btnFaculty = document.getElementById('btnFaculty');
      const submitBtn = document.querySelector('#submitBtn .text');
      const userTypeInput = document.getElementById('userType');

      userTypeInput.value = role;
      if (role === 'student') {
        btnStudent.classList.add('active');
        btnFaculty.classList.remove('active');
        submitBtn.textContent = 'Login As Student';
      } else {
        btnFaculty.classList.add('active');
        btnStudent.classList.remove('active');
        submitBtn.textContent = 'Login As Faculty';
      }
    }

    // Initialize password visibility toggle with proper event handling
    function initPasswordToggle() {
      const togglePwd = document.getElementById('togglePwd');
      const password = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');

      if (!togglePwd) return;

      togglePwd.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const isPassword = password.type === 'password';
        password.type = isPassword ? 'text' : 'password';
        eyeIcon.classList.toggle('fa-eye');
        eyeIcon.classList.toggle('fa-eye-slash');
      });
    }

    // Initialize when DOM is ready to avoid autofill lag
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPasswordToggle);
    } else {
      initPasswordToggle();
    }

    // Optimize autofill handling - prevent validation lag
    document.addEventListener('input', (e) => {
      if (e.target.id === 'email' || e.target.id === 'password') {
        e.target.classList.remove('is-invalid');
      }
    }, true);
  </script>
</body>

</html>
