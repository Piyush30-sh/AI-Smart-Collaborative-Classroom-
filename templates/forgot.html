<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — AI Classroom</title>
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />

</head>


{% block title %}Forgot Password — AI Study Planner{% endblock %}

{% block content %}
<div class="container px-4 py-4">
  <div class="row justify-content-center" style="min-height: 50vh; align-items: center; color: #f6f9f7;">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-transparent">Reset your password</div>
        <div class="card-body">
          <form method="POST">
            <div class="mb-3">
              <label class="form-label">Enter your account email </label>
              <input type="email" name="email" class="form-control" required style = "background-color: #0f172a; color: #f6f9f7; border: 1px solid #334155;">
            </div>
            <button class="btn btn-primary" type="submit">Send reset link</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
