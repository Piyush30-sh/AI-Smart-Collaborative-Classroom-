<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — AI Classroom</title>
  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script>
    (function syncThemeEarly() {
      try {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const raw = localStorage.getItem('theme') || localStorage.getItem('siteTheme');
        const theme = (raw === 'dark' || raw === 'light') ? raw : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-bs-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
</head>

<body class="auth-body">

  <!-- Home Button (Top-Left) -->
  <div class="position-fixed top-0 start-0 p-3" style="z-index:999">
    <a href="{{ url_for('index') }}" class="btn btn-sm auth-home-btn shadow-sm">
      <i class="fas fa-arrow-left me-2"></i>Home
    </a>
  </div>

  <!-- Dark-mode toggle (top-right) -->
  <div class="position-fixed top-0 end-0 p-3" style="z-index:999">
    <div class="form-check form-switch mb-0">
      <input class="form-check-input" type="checkbox" id="darkToggle" role="switch" />
      <label class="form-check-label text-muted" for="darkToggle">
        <i class="fas fa-moon"></i>
      </label>
    </div>
  </div>

  <div class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100">
    <div class="auth-card card shadow-lg border-0 p-4" style="width: 420px; max-width: 95vw;">
      <div class="card-body p-3">
        <div class="text-center mb-4">
          <div class="auth-brand-icon mb-3 text-primary">
            <i class="fas fa-key fa-2x"></i>
          </div>
          <h3 class="fw-bold">Reset Password</h3>
          <p class="text-muted small">Enter your email to receive a password reset link</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for cat, msg in messages %}
              <div class="alert alert-{{ cat }} alert-dismissible fade show py-2" role="alert">
                {{ msg }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email address</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
              <input type="email" name="email" id="email" class="form-control" placeholder="you@example.com" required autocomplete="email" />
            </div>
          </div>
          <button class="btn btn-primary w-100 fw-semibold py-2.5 mb-3" type="submit">
            <i class="fas fa-paper-plane me-2"></i>Send Reset Link
          </button>
        </form>

        <p class="text-center mb-0 small text-muted">
          Remembered your password?
          <a href="{{ url_for('login') }}" class="fw-bold" data-auth-transition style="color: #6366f1;">Back to Login</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
